version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cozinha-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cozinha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cozinha-network

  backend:
    build: 
      context: ./backend
    container_name: cozinha-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cozinha}?schema=public
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - SEED_SECRET=${SEED_SECRET:-cozinha2026}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - cozinha-network

  frontend:
    build: 
      context: ./frontend
    container_name: cozinha-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=https://cozinhaplus.duckdns.org/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - cozinha-network

  caddy:
    image: caddy:2-alpine
    container_name: cozinha-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cozinha-network
    depends_on:
      - frontend
      - backend

networks:
  cozinha-network:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
